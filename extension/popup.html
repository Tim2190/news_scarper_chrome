<!doctype html><html lang="ru"><head><meta charset="utf-8">
<style>
 body{font:14px system-ui,sans-serif;width:330px;margin:12px}
 button{display:block;width:100%;margin:5px 0;padding:8px;cursor:pointer}
 #info{margin:8px 0;white-space:pre-wrap;min-height:70px}
 input{margin:2px 0}
 .hint{color:#666;font-size:12px}
</style></head><body>
<b>Архив новостей nazarbayev.kz</b>

<button id="csv">Скачать CSV за период</button>
<button id="match"><b>Сопоставить с каталогом…</b></button>

<script src="db.js"></script><script src="popup.js"></script>
